<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Upah Pekerja Harian</title>
</head>
<body>
    <h2>Rekap Upah Pekerja Harian</h2>

    <label for="pekerja">Nama Pekerja</label>

    <label for="jamKerja">Jam Kerja</label>
    <input type="number" id="jamKerja" placeholder="Jumlah jam"><br>

    <label for="upahJam">Upah per Jam</label>
    <input type="number" id="upahJam" placeholder="Dalam rupiah"><br>

    <button id="btnSimpan">Simpan</button>

    <p id="hasil"></p>

    <script src="upah.js"></script>
</body>
</html>
